"$schema" = "node_modules/wrangler/config-schema.json"
name = "app-worker"
main = "apps/worker/src/app/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[dev]
ip = "127.0.0.1"
inspector_port = 0

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api", "/api/*", "/mcp*", "/.well-known", "/.well-known/*", "/cdn-cgi", "/cdn-cgi/*"]

[[d1_databases]]
binding = "DB"
database_name = "app-db"
# Replace this local-only placeholder with your own D1 database ID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "apps/worker/migrations"

[observability]
enabled = true

# Set JWT_SECRET through `wrangler secret put JWT_SECRET` for deployment.
# Optional Access/MCP variables are documented in docs/access-and-mcp.md.
