name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Opt in with a repository variable. Manual runs obey the same gate.
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify and build
        run: pnpm run ci
      - name: Prepare deployment settings
        run: pnpm run deploy:prepare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Validate deployment bundle
        run: pnpm exec wrangler deploy --dry-run --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/cloudflare-worker-secrets.json"
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker and web assets
        run: pnpm exec wrangler deploy --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/cloudflare-worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Remove deployment files
        if: always()
        run: rm -f wrangler.deploy.json "$RUNNER_TEMP/cloudflare-worker-secrets.json"
